<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respuestas RSVP</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --cream:#FFFFFF; --gold:#7A2432; --gold-soft:#F1DCD3;
    --sage:#9C4A50; --ink:#2E2621; --line:#E3E1DE;
    --radius-lg:20px; --radius-md:12px; --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(46,38,33,0.04), 0 16px 32px -12px rgba(46,38,33,0.12);
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,'Karla',sans-serif;
    background:var(--cream); color:var(--ink);
    margin:0; padding:32px 24px;
  }
  h1{font-family:'Cormorant Garamond',serif; font-size:30px; margin-bottom:4px;}
  .sub{color:#8A8275; font-size:14px; margin-bottom:24px;}
  .gate{
    max-width:360px; margin:80px auto; background:#fff;
    border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:32px;
  }
  .gate label{display:block; font-size:13px; font-weight:600; margin-bottom:8px;}
  .gate input{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:15px; margin-bottom:14px; background:#fff;
  }
  button{
    background:var(--gold); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:11px 18px; font-weight:700; cursor:pointer; font-size:14px;
    box-shadow:0 3px 10px rgba(122,36,50,0.28); transition:background .15s, transform .15s;
  }
  button:hover{background:#5E1B26; transform:translateY(-1px);}
  .error{color:#B05A4A; font-size:13px; margin-top:4px;}
  #panel{display:none; max-width:1600px; margin:0 auto;}
  .stats{display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
  .stat{
    background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    padding:14px 20px; min-width:120px; flex:1;
  }
  .stat.highlight{background:var(--sage);}
  .stat.highlight .n, .stat.highlight .l{color:#fff;}
  .stat .n{font-family:'Cormorant Garamond',serif; font-size:28px; color:var(--gold);}
  .stat .l{font-size:12px; color:#8A8275; text-transform:uppercase; letter-spacing:.05em;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:12px; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1; min-width:220px; max-width:420px;}
  .search-wrap input{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; background:#fff;
  }
  .search-wrap input:focus{outline:none; border-color:var(--sage);}
  .search-count{font-size:12px; color:#8A8275; margin-top:6px;}
  .no-results{
    background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    padding:24px; text-align:center; color:#8A8275; font-size:14px; margin-bottom:16px;
  }
  table{
    width:100%; table-layout:fixed; border-collapse:collapse; background:#fff;
    font-size:13px;
  }
  th,td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); word-wrap:break-word;}
  th{background:var(--gold-soft); font-weight:700; position:sticky; top:0;}
  tr:last-child td{border-bottom:none;}
  tr.fila-borrando{opacity:.4;}
  th:nth-child(1){width:6%;}
  th:nth-child(2){width:7%;}
  th:nth-child(3){width:7%;}
  th:nth-child(4){width:6%;}
  th:nth-child(5){width:6%;}
  th:nth-child(6){width:7%;}
  th:nth-child(7){width:7%;}
  th:nth-child(8){width:7%;}
  th:nth-child(9){width:6%;}
  th:nth-child(10){width:7%;}
  th:nth-child(11){width:7%;}
  th:nth-child(12){width:12%;}
  th:nth-child(13){width:15%;}
  .si{color:var(--sage); font-weight:600;}
  .no{color:#B05A4A; font-weight:600;}
  .table-wrap{overflow-x:auto; border-radius:var(--radius-md); box-shadow:var(--shadow-card);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .row-actions button{
    padding:6px 10px; font-size:12px; font-weight:600; box-shadow:none; border-radius:8px;
  }
  .btn-editar{background:var(--gold-soft); color:var(--gold);}
  .btn-editar:hover{background:#E7C4B8; transform:none;}
  .btn-reiniciar{background:#EFE9DE; color:#8A6A2E;}
  .btn-reiniciar:hover{background:#E3D8C0; transform:none;}
  .btn-eliminar{background:#F3DEDE; color:#A33A3A;}
  .btn-eliminar:hover{background:#EBC7C7; transform:none;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(46,38,33,.45);
    align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal-overlay.visible{display:flex;}
  .modal{
    background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
    padding:28px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto;
  }
  .modal h2{font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:18px;}
  .modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-grid .span-2{grid-column:1 / -1;}
  .modal label{display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:#6B6259;}
  .modal input, .modal select, .modal textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; background:#fff;
  }
  .modal textarea{resize:vertical; min-height:50px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
  .btn-cancelar{background:#EDEAE5; color:var(--ink); box-shadow:none;}
  .btn-cancelar:hover{background:#E2DDD5; transform:none;}
  .modal-error{color:#B05A4A; font-size:13px; margin-top:10px; min-height:16px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:var(--radius-sm);
    font-size:14px; box-shadow:var(--shadow-card); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.visible{opacity:1;}

  @media (max-width:760px){
    body{padding:20px 14px;}
    h1{font-size:24px;}
    .stats{gap:10px;}
    .stat{min-width:calc(50% - 5px); padding:12px 14px;}
    .stat .n{font-size:22px;}
    .toolbar{justify-content:stretch;}
    .toolbar button{width:100%;}
    .search-wrap{max-width:none; width:100%;}

    .table-wrap{overflow-x:visible; border-radius:0; box-shadow:none; background:none;}
    table{table-layout:auto;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tr{
      margin-bottom:14px; background:#fff; border-radius:var(--radius-md);
      box-shadow:var(--shadow-card); overflow:hidden;
    }
    td{
      display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
      padding:10px 14px; border-bottom:1px solid var(--line); text-align:right;
    }
    td:before{
      content:attr(data-label); text-align:left; flex-shrink:0;
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
      color:#8A8275; padding-top:2px;
    }
    td.td-acciones{display:block; border-bottom:none; padding:12px 14px;}
    td.td-acciones:before{display:block; margin-bottom:8px;}
    td.td-acciones .row-actions button{flex:1; min-width:0;}

    .modal{padding:20px;}
    .modal-grid{grid-template-columns:1fr;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions button{width:100%;}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <label for="token">Contraseña de administrador</label>
  <input type="password" id="token" placeholder="Contraseña">
  <button id="entrar">Ver respuestas</button>
  <div class="error" id="gateError"></div>
</div>

<div id="panel">
  <h1>Respuestas RSVP</h1>
  <div class="sub">Listado de confirmaciones recibidas</div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="buscador" placeholder="Buscar por nombre, apellidos, ciudad...">
      <div class="search-count" id="buscadorCount"></div>
    </div>
    <button id="exportar">Descargar CSV</button>
  </div>

  <div class="no-results" id="noResults" style="display:none;">No hay respuestas que coincidan con la búsqueda.</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Nombre</th><th>Apellidos</th><th>Asiste</th>
          <th>Acompañante</th><th>Trat. acomp.</th><th>Nombre acomp.</th><th>Apellidos acomp.</th><th>Transporte</th>
          <th>Alergias</th><th>Alergias acomp.</th><th>Dirección</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Editar respuesta</h2>
    <form id="editForm">
      <div class="modal-grid">
        <div>
          <label for="editTratamiento">Tratamiento</label>
          <select id="editTratamiento">
            <option value="">—</option>
            <option value="Sr.">Sr.</option>
            <option value="Sra.">Sra.</option>
            <option value="Srta.">Srta.</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="editAsiste">Asiste</label>
          <select id="editAsiste">
            <option value="completa">Toda la boda</option>
            <option value="copas">Solo copas</option>
            <option value="no">No asiste</option>
          </select>
        </div>
        <div>
          <label for="editNombre">Nombre</label>
          <input type="text" id="editNombre">
        </div>
        <div>
          <label for="editApellidos">Apellidos</label>
          <input type="text" id="editApellidos">
        </div>
        <div class="span-2">
          <label for="editCalle">Calle y número</label>
          <input type="text" id="editCalle">
        </div>
        <div>
          <label for="editCp">Código postal</label>
          <input type="text" id="editCp">
        </div>
        <div>
          <label for="editCiudad">Ciudad</label>
          <input type="text" id="editCiudad">
        </div>
        <div>
          <label for="editProvincia">Provincia</label>
          <input type="text" id="editProvincia">
        </div>
        <div>
          <label for="editTransporte">Transporte</label>
          <select id="editTransporte">
            <option value="no">No necesita</option>
            <option value="ida">Ida</option>
            <option value="vuelta">Vuelta</option>
            <option value="ida_vuelta">Ida y vuelta</option>
          </select>
        </div>
        <div class="span-2">
          <label for="editAlergias">Alergias</label>
          <textarea id="editAlergias"></textarea>
        </div>
        <div>
          <label for="editConAcompanante">Acompañante</label>
          <select id="editConAcompanante">
            <option value="no">No</option>
            <option value="si">Sí</option>
          </select>
        </div>
        <div>
          <label for="editAcompananteTratamiento">Tratamiento acomp.</label>
          <select id="editAcompananteTratamiento">
            <option value="">—</option>
            <option value="Sr.">Sr.</option>
            <option value="Sra.">Sra.</option>
            <option value="Srta.">Srta.</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="editAcompananteNombre">Nombre acomp.</label>
          <input type="text" id="editAcompananteNombre">
        </div>
        <div>
          <label for="editAcompananteApellidos">Apellidos acomp.</label>
          <input type="text" id="editAcompananteApellidos">
        </div>
        <div class="span-2">
          <label for="editAcompananteAlergias">Alergias acomp.</label>
          <textarea id="editAcompananteAlergias"></textarea>
        </div>
      </div>
      <div class="modal-error" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
        <button type="submit">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentData = [];
  let adminToken = '';
  let editandoId = null;

  document.getElementById('entrar').addEventListener('click', cargar);
  document.getElementById('token').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') cargar();
  });

  async function cargar() {
    const token = document.getElementById('token').value.trim();
    const errorEl = document.getElementById('gateError');
    errorEl.textContent = '';
    if (!token) return;

    try {
      const res = await fetch('/api/respuestas', {
        headers: { 'x-admin-token': token }
      });
      if (!res.ok) {
        errorEl.textContent = 'Contraseña incorrecta.';
        return;
      }
      adminToken = token;
      currentData = await res.json();
      render(currentData);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Error al conectar con el servidor.';
    }
  }

  async function recargar() {
    const res = await fetch('/api/respuestas', { headers: { 'x-admin-token': adminToken } });
    currentData = await res.json();
    render(currentData);
  }

  // 'propio'/'autobus'/'otro' son valores heredados de antes de tener
  // las opciones ida/vuelta/ida y vuelta/no necesito
  function transporteLabel(v) {
    if (v === 'ida') return 'Ida';
    if (v === 'vuelta') return 'Vuelta';
    if (v === 'ida_vuelta') return 'Ida y vuelta';
    if (v === 'no') return 'No necesita';
    if (v === 'propio') return 'Transporte propio (dato antiguo)';
    if (v === 'autobus') return 'Autobús (dato antiguo)';
    if (v === 'otro') return 'Otro (dato antiguo)';
    return v || '';
  }

  // 'si' es el valor heredado de antes de separar "toda la boda" / "solo copas"
  function asisteLabel(v) {
    if (v === 'completa' || v === 'si') return 'Toda la boda';
    if (v === 'copas') return 'Solo copas';
    return 'No asiste';
  }

  function normalizar(str) {
    return String(str || '')
      .toLowerCase()
      .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  }

  function coincideBusqueda(r, termino) {
    if (!termino) return true;
    const campos = [
      r.tratamiento, r.nombre, r.apellidos,
      r.acompanante_tratamiento, r.acompanante_nombre, r.acompanante_apellidos,
      r.calle, r.cp, r.ciudad, r.provincia, r.alergias, r.acompanante_alergias
    ];
    const texto = normalizar(campos.join(' '));
    return termino.split(/\s+/).filter(Boolean).every(palabra => texto.includes(palabra));
  }

  function render(data) {
    const total = data.length;
    const completaCount = data.filter(r => r.asiste === 'completa' || r.asiste === 'si').length;
    const copasCount = data.filter(r => r.asiste === 'copas').length;
    const noCount = data.filter(r => r.asiste === 'no').length;
    const asistenCount = completaCount + copasCount;
    const acompanantes = data.filter(r => r.asiste !== 'no' && r.con_acompanante === 'si').length;
    const totalInvitados = asistenCount + acompanantes;
    const pctAsistencia = total ? Math.round((asistenCount / total) * 100) : 0;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="n">${total}</div><div class="l">Respuestas</div></div>
      <div class="stat"><div class="n">${noCount}</div><div class="l">No asisten</div></div>
      <div class="stat"><div class="n">${completaCount}</div><div class="l">Toda la boda</div></div>
      <div class="stat"><div class="n">${copasCount}</div><div class="l">Solo copas</div></div>
      <div class="stat"><div class="n">${acompanantes}</div><div class="l">Acompañantes</div></div>
      <div class="stat"><div class="n">${pctAsistencia}%</div><div class="l">% asistencia</div></div>
      <div class="stat highlight"><div class="n">${totalInvitados}</div><div class="l">Total asistentes</div></div>
    `;

    renderFiltrado();
  }

  function renderFiltrado() {
    const termino = normalizar(document.getElementById('buscador').value.trim());
    const data = currentData.filter(r => coincideBusqueda(r, termino));

    const countEl = document.getElementById('buscadorCount');
    countEl.textContent = termino ? `${data.length} de ${currentData.length} respuestas` : '';

    document.getElementById('noResults').style.display = (termino && !data.length) ? 'block' : 'none';

    document.getElementById('rows').innerHTML = data.map(r => `
      <tr data-id="${r.id}">
        <td data-label="Fecha">${new Date(r.created_at).toLocaleDateString('es-ES')}</td>
        <td data-label="Nombre">${escapeHtml(r.tratamiento)} ${escapeHtml(r.nombre)}</td>
        <td data-label="Apellidos">${escapeHtml(r.apellidos)}</td>
        <td data-label="Asiste" class="${r.asiste === 'no' ? 'no' : 'si'}">${asisteLabel(r.asiste)}</td>
        <td data-label="Acompañante">${r.con_acompanante === 'si' ? 'Sí' : 'No'}</td>
        <td data-label="Trat. acomp.">${escapeHtml(r.acompanante_tratamiento)}</td>
        <td data-label="Nombre acomp.">${escapeHtml(r.acompanante_nombre)}</td>
        <td data-label="Apellidos acomp.">${escapeHtml(r.acompanante_apellidos)}</td>
        <td data-label="Transporte">${escapeHtml(transporteLabel(r.transporte))}</td>
        <td data-label="Alergias">${escapeHtml(r.alergias)}</td>
        <td data-label="Alergias acomp.">${escapeHtml(r.acompanante_alergias)}</td>
        <td data-label="Dirección">${escapeHtml(r.calle)}, ${escapeHtml(r.cp)} ${escapeHtml(r.ciudad)} (${escapeHtml(r.provincia)})</td>
        <td data-label="Acciones" class="td-acciones">
          <div class="row-actions">
            <button type="button" class="btn-editar" data-accion="editar" data-id="${r.id}">Editar</button>
            <button type="button" class="btn-reiniciar" data-accion="reiniciar" data-id="${r.id}">Reiniciar</button>
            <button type="button" class="btn-eliminar" data-accion="eliminar" data-id="${r.id}">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('buscador').addEventListener('input', renderFiltrado);

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('visible');
    clearTimeout(mostrarToast._t);
    mostrarToast._t = setTimeout(() => toast.classList.remove('visible'), 2600);
  }

  document.getElementById('rows').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-accion]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const fila = currentData.find(r => r.id === id);
    if (!fila) return;

    if (btn.dataset.accion === 'editar') abrirModal(fila);
    else if (btn.dataset.accion === 'reiniciar') reiniciarFila(fila);
    else if (btn.dataset.accion === 'eliminar') eliminarFila(fila);
  });

  function abrirModal(r) {
    editandoId = r.id;
    document.getElementById('editTratamiento').value = r.tratamiento || '';
    document.getElementById('editAsiste').value = (r.asiste === 'si' ? 'completa' : r.asiste) || 'completa';
    document.getElementById('editNombre').value = r.nombre || '';
    document.getElementById('editApellidos').value = r.apellidos || '';
    document.getElementById('editCalle').value = r.calle || '';
    document.getElementById('editCp').value = r.cp || '';
    document.getElementById('editCiudad').value = r.ciudad || '';
    document.getElementById('editProvincia').value = r.provincia || '';
    document.getElementById('editTransporte').value = r.transporte || 'no';
    document.getElementById('editAlergias').value = r.alergias || '';
    document.getElementById('editConAcompanante').value = r.con_acompanante || 'no';
    document.getElementById('editAcompananteTratamiento').value = r.acompanante_tratamiento || '';
    document.getElementById('editAcompananteNombre').value = r.acompanante_nombre || '';
    document.getElementById('editAcompananteApellidos').value = r.acompanante_apellidos || '';
    document.getElementById('editAcompananteAlergias').value = r.acompanante_alergias || '';
    document.getElementById('modalError').textContent = '';
    document.getElementById('modalOverlay').classList.add('visible');
  }

  function cerrarModal() {
    editandoId = null;
    document.getElementById('modalOverlay').classList.remove('visible');
  }

  document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') cerrarModal();
  });

  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('modalError');
    errorEl.textContent = '';

    const asiste = document.getElementById('editAsiste').value;
    const payload = {
      tratamiento: document.getElementById('editTratamiento').value,
      nombre: document.getElementById('editNombre').value.trim(),
      apellidos: document.getElementById('editApellidos').value.trim(),
      calle: document.getElementById('editCalle').value.trim(),
      cp: document.getElementById('editCp').value.trim(),
      ciudad: document.getElementById('editCiudad').value.trim(),
      provincia: document.getElementById('editProvincia').value.trim(),
      asiste: asiste,
      conAcompanante: document.getElementById('editConAcompanante').value,
      acompananteTratamiento: document.getElementById('editAcompananteTratamiento').value,
      acompananteNombre: document.getElementById('editAcompananteNombre').value.trim(),
      acompananteApellidos: document.getElementById('editAcompananteApellidos').value.trim(),
      acompananteAlergias: document.getElementById('editAcompananteAlergias').value.trim(),
      transporte: document.getElementById('editTransporte').value,
      alergias: document.getElementById('editAlergias').value.trim()
    };

    if (!payload.nombre || !payload.apellidos) {
      errorEl.textContent = 'Nombre y apellidos son obligatorios.';
      return;
    }
    if (asiste !== 'no' && (!payload.tratamiento || !payload.calle || !payload.cp || !payload.ciudad || !payload.provincia)) {
      errorEl.textContent = 'Faltan campos obligatorios (tratamiento y dirección) para quien asiste.';
      return;
    }

    try {
      const res = await fetch('/api/respuestas/' + editandoId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        errorEl.textContent = (data && data.error) || 'Error al guardar.';
        return;
      }
      cerrarModal();
      await recargar();
      mostrarToast('Cambios guardados.');
    } catch (err) {
      errorEl.textContent = 'Error al conectar con el servidor.';
    }
  });

  async function reiniciarFila(r) {
    const ok = confirm(
      'Vas a reiniciar la respuesta de ' + r.nombre + ' ' + r.apellidos + '.\n\n' +
      'El invitado podrá volver a rellenar el formulario desde cero la próxima vez que abra el enlace. ' +
      'Su respuesta actual se conserva en el listado (no se borra nada); si vuelve a enviarlo, aparecerá como una respuesta nueva.'
    );
    if (!ok) return;
    try {
      const res = await fetch('/api/respuestas/' + r.id + '/reset', {
        method: 'POST',
        headers: { 'x-admin-token': adminToken }
      });
      if (!res.ok) { mostrarToast('No se ha podido reiniciar.'); return; }
      mostrarToast('Respuesta reiniciada.');
      await recargar();
    } catch (err) {
      mostrarToast('Error al conectar con el servidor.');
    }
  }

  async function eliminarFila(r) {
    const ok = confirm(
      'Vas a eliminar la respuesta de ' + r.nombre + ' ' + r.apellidos + ' del listado.\n\n' +
      'Dejará de aparecer aquí y el invitado podrá rellenar el formulario de nuevo desde el mismo enlace ' +
      '(si lo hace, sus nuevos datos ocuparán este mismo registro). Los datos no se destruyen de forma irreversible, ' +
      'pero esta acción no tiene un botón de deshacer en esta pantalla.'
    );
    if (!ok) return;
    try {
      const res = await fetch('/api/respuestas/' + r.id, {
        method: 'DELETE',
        headers: { 'x-admin-token': adminToken }
      });
      if (!res.ok) { mostrarToast('No se ha podido eliminar.'); return; }
      mostrarToast('Respuesta eliminada.');
      await recargar();
    } catch (err) {
      mostrarToast('Error al conectar con el servidor.');
    }
  }

  document.getElementById('exportar').addEventListener('click', () => {
    if (!currentData.length) return;
    const columnas = [
      { header: 'Fecha', valor: r => new Date(r.created_at).toLocaleDateString('es-ES') },
      { header: 'Tratamiento', valor: r => r.tratamiento || '' },
      { header: 'Nombre', valor: r => r.nombre || '' },
      { header: 'Apellidos', valor: r => r.apellidos || '' },
      { header: 'Asiste', valor: r => asisteLabel(r.asiste) },
      { header: 'Acompañante', valor: r => r.con_acompanante === 'si' ? 'Sí' : 'No' },
      { header: 'Tratamiento acompañante', valor: r => r.acompanante_tratamiento || '' },
      { header: 'Nombre acompañante', valor: r => r.acompanante_nombre || '' },
      { header: 'Apellidos acompañante', valor: r => r.acompanante_apellidos || '' },
      { header: 'Transporte', valor: r => transporteLabel(r.transporte) },
      { header: 'Alergias', valor: r => r.alergias || '' },
      { header: 'Alergias acompañante', valor: r => r.acompanante_alergias || '' },
      { header: 'Calle', valor: r => r.calle || '' },
      { header: 'Código postal', valor: r => r.cp || '' },
      { header: 'Ciudad', valor: r => r.ciudad || '' },
      { header: 'Provincia', valor: r => r.provincia || '' }
    ];
    function celdaSegura(valor) {
      let str = String(valor);
      // Evita que Excel/Sheets interprete el valor como fórmula si un invitado
      // escribe algo que empieza por =, +, -, @, tab o retorno de carro.
      if (/^[=+\-@\t\r]/.test(str)) str = "'" + str;
      return `"${str.replace(/"/g, '""')}"`;
    }
    const csvRows = [columnas.map(c => c.header).join(',')];
    currentData.forEach(r => {
      csvRows.push(columnas.map(c => celdaSegura(c.valor(r))).join(','));
    });
    const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'respuestas-rsvp.csv';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
