<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respuestas RSVP</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --cream:#FFFFFF; --gold:#7A2432; --gold-soft:#F1DCD3;
    --sage:#9C4A50; --ink:#2E2621; --line:#E3E1DE;
    --radius-lg:20px; --radius-md:12px; --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(46,38,33,0.04), 0 16px 32px -12px rgba(46,38,33,0.12);
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,'Karla',sans-serif;
    background:var(--cream); color:var(--ink);
    margin:0; padding:32px 24px;
  }
  h1{font-family:'Cormorant Garamond',serif; font-size:30px; margin-bottom:4px;}
  .sub{color:#8A8275; font-size:14px; margin-bottom:24px;}
  .gate{
    max-width:360px; margin:80px auto; background:#fff;
    border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:32px;
  }
  .gate label{display:block; font-size:13px; font-weight:600; margin-bottom:8px;}
  .gate input{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:15px; margin-bottom:14px; background:#fff;
  }
  button{
    background:var(--gold); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:11px 18px; font-weight:700; cursor:pointer; font-size:14px;
    box-shadow:0 3px 10px rgba(122,36,50,0.28); transition:background .15s, transform .15s;
  }
  button:hover{background:#5E1B26; transform:translateY(-1px);}
  .error{color:#B05A4A; font-size:13px; margin-top:4px;}
  #panel{display:none; max-width:1600px; margin:0 auto;}
  .stats{display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
  .stat{
    background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    padding:14px 20px; min-width:120px; flex:1;
  }
  .stat.highlight{background:var(--sage);}
  .stat.highlight .n, .stat.highlight .l{color:#fff;}
  .stat .n{font-family:'Cormorant Garamond',serif; font-size:28px; color:var(--gold);}
  .stat .l{font-size:12px; color:#8A8275; text-transform:uppercase; letter-spacing:.05em;}
  .toolbar{display:flex; justify-content:flex-start; align-items:flex-start; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1; min-width:220px; max-width:420px;}
  .toolbar-actions{display:flex; gap:10px;}
  .btn-secundario{
    background:#fff; color:var(--gold); border:1.5px solid var(--gold);
    box-shadow:none;
  }
  .btn-secundario:hover{background:var(--gold-soft); transform:none;}
  .btn-secundario.girando{pointer-events:none; opacity:.7;}
  .search-wrap input{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; background:#fff;
  }
  .search-wrap input:focus{outline:none; border-color:var(--sage);}
  .filtro-asiste{
    padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; background:#fff; cursor:pointer;
  }
  .filtro-asiste:focus{outline:none; border-color:var(--sage);}
  .search-count{font-size:12px; color:#8A8275; margin-top:6px;}
  .no-results{
    background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    padding:24px; text-align:center; color:#8A8275; font-size:14px; margin-bottom:16px;
  }
  table{
    width:100%; table-layout:fixed; border-collapse:collapse; background:#fff;
    font-size:13px;
  }
  th,td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); word-wrap:break-word;}
  th{background:var(--gold-soft); font-weight:700; position:sticky; top:0;}
  tr:last-child td{border-bottom:none;}
  tr.fila-borrando{opacity:.4;}
  th:nth-child(1){width:5%;}
  th:nth-child(2){width:7%;}
  th:nth-child(3){width:7%;}
  th:nth-child(4){width:8%;}
  th:nth-child(5){width:6%;}
  th:nth-child(6){width:5%;}
  th:nth-child(7){width:5%;}
  th:nth-child(8){width:6%;}
  th:nth-child(9){width:7%;}
  th:nth-child(10){width:6%;}
  th:nth-child(11){width:6%;}
  th:nth-child(12){width:6%;}
  th:nth-child(13){width:9%;}
  th:nth-child(14){width:5%;}
  th:nth-child(15){width:5%;}
  th:nth-child(16){width:11%;}
  .categoria-grupo{display:block; color:#8A8275; font-size:12px; margin-top:2px;}
  .sin-asignar{color:#B9B2A8;}

  /* Desplegable con buscador (ficha) */
  .combo{position:relative;}
  .combo-lista{
    display:none; position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
    list-style:none; margin:0; padding:4px; background:#fff; border:1.5px solid var(--line);
    border-radius:var(--radius-sm); box-shadow:var(--shadow-card); max-height:220px; overflow-y:auto;
  }
  .combo.abierto .combo-lista{display:block;}
  .combo-lista li{padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px;}
  .combo-lista li.activo, .combo-lista li:hover{background:var(--gold-soft);}
  .combo-lista li.vacio{color:#8A8275; cursor:default; background:none;}

  /* Filtros de selección múltiple */
  .filtro-multi{position:relative;}
  .filtro-multi > summary{
    list-style:none; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; background:#fff; cursor:pointer; white-space:nowrap; user-select:none;
  }
  .filtro-multi > summary::-webkit-details-marker{display:none;}
  .filtro-multi > summary::after{content:' ▾'; color:#8A8275;}
  .filtro-multi.activo > summary{border-color:var(--sage); color:var(--gold); font-weight:600;}
  .filtro-panel{
    position:absolute; z-index:30; top:calc(100% + 6px); left:0; width:280px; max-width:85vw;
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-md);
    box-shadow:var(--shadow-card); padding:10px;
  }
  .filtro-panel input[type=text]{
    width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; margin-bottom:8px;
  }
  .filtro-opciones{max-height:280px; overflow-y:auto;}
  .filtro-opciones label{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:14px; cursor:pointer; border-radius:6px;}
  .filtro-opciones label:hover{background:var(--gold-soft);}
  .filtro-limpiar{
    margin-top:8px; width:100%; background:#EDEAE5; color:var(--ink); box-shadow:none; padding:8px; font-size:13px;
  }
  .filtro-limpiar:hover{background:#E2DDD5; transform:none;}
  .si{color:var(--sage); font-weight:600;}
  .no{color:#B05A4A; font-weight:600;}
  .table-wrap{overflow-x:auto; border-radius:var(--radius-md); box-shadow:var(--shadow-card);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .row-actions button{
    padding:6px 10px; font-size:12px; font-weight:600; box-shadow:none; border-radius:8px;
  }
  .btn-editar{background:var(--gold-soft); color:var(--gold);}
  .btn-editar:hover{background:#E7C4B8; transform:none;}
  .btn-reiniciar{background:#EFE9DE; color:#8A6A2E;}
  .btn-reiniciar:hover{background:#E3D8C0; transform:none;}
  .btn-eliminar{background:#F3DEDE; color:#A33A3A;}
  .btn-eliminar:hover{background:#EBC7C7; transform:none;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(46,38,33,.45);
    align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal-overlay.visible{display:flex;}
  .modal{
    background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
    padding:28px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto;
  }
  .modal h2{font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:18px;}
  .modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-grid .span-2{grid-column:1 / -1;}
  .modal label{display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:#6B6259;}
  .modal input, .modal select, .modal textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:14px; font-family:inherit; background:#fff;
  }
  .modal textarea{resize:vertical; min-height:50px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
  .btn-cancelar{background:#EDEAE5; color:var(--ink); box-shadow:none;}
  .btn-cancelar:hover{background:#E2DDD5; transform:none;}
  .modal-error{color:#B05A4A; font-size:13px; margin-top:10px; min-height:16px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:var(--radius-sm);
    font-size:14px; box-shadow:var(--shadow-card); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.visible{opacity:1;}

  @media (max-width:760px){
    body{padding:20px 14px;}
    h1{font-size:24px;}
    .stats{gap:10px;}
    .stat{min-width:calc(50% - 5px); padding:12px 14px;}
    .stat .n{font-size:22px;}
    .toolbar{justify-content:stretch;}
    .toolbar-actions{width:100%; flex-wrap:wrap;}
    .toolbar-actions button{flex:1 1 calc(50% - 5px); width:auto;}
    .search-wrap{max-width:none; width:100%;}
    .filtro-asiste{width:100%;}
    .filtro-multi{width:100%;}
    .filtro-panel{width:100%; max-width:none;}

    .table-wrap{overflow-x:visible; border-radius:0; box-shadow:none; background:none;}
    table{table-layout:auto;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tr{
      margin-bottom:14px; background:#fff; border-radius:var(--radius-md);
      box-shadow:var(--shadow-card); overflow:hidden;
    }
    td{
      display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
      padding:10px 14px; border-bottom:1px solid var(--line); text-align:right;
    }
    td:before{
      content:attr(data-label); text-align:left; flex-shrink:0;
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
      color:#8A8275; padding-top:2px;
    }
    td.td-acciones{display:block; border-bottom:none; padding:12px 14px;}
    td.td-acciones:before{display:block; margin-bottom:8px;}
    td.td-acciones .row-actions button{flex:1; min-width:0;}

    .modal{padding:20px;}
    .modal-grid{grid-template-columns:1fr;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions button{width:100%;}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <label for="token">Contraseña de administrador</label>
  <input type="password" id="token" placeholder="Contraseña">
  <button id="entrar">Ver respuestas</button>
  <div class="error" id="gateError"></div>
</div>

<div id="panel">
  <h1>Respuestas RSVP</h1>
  <div class="sub">Listado de confirmaciones recibidas</div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="buscador" placeholder="Buscar por nombre, apellidos, ciudad...">
      <div class="search-count" id="buscadorCount"></div>
    </div>
    <select id="filtroAsiste" class="filtro-asiste">
      <option value="">Todos</option>
      <option value="completa">Toda la boda</option>
      <option value="copas">Solo copas</option>
      <option value="no">No asiste</option>
      <option value="pendiente">Pendiente de contestar</option>
    </select>
    <details class="filtro-multi" id="filtroInvitadoPor">
      <summary>Invitado por</summary>
      <div class="filtro-panel">
        <div class="filtro-opciones"></div>
        <button type="button" class="filtro-limpiar">Quitar filtro</button>
      </div>
    </details>
    <details class="filtro-multi" id="filtroGrupo">
      <summary>Grupo</summary>
      <div class="filtro-panel">
        <input type="text" class="filtro-buscar" placeholder="Buscar grupo..." autocomplete="off">
        <div class="filtro-opciones"></div>
        <button type="button" class="filtro-limpiar">Quitar filtro</button>
      </div>
    </details>
    <div class="toolbar-actions">
      <button id="actualizar" class="btn-secundario">Actualizar</button>
      <button id="anadir" class="btn-secundario">Añadir invitado</button>
      <button id="verQr" class="btn-secundario">Ver código QR</button>
      <button id="exportarDirecciones" class="btn-secundario">Excel direcciones (sobres)</button>
      <button id="exportar">Descargar CSV</button>
    </div>
  </div>

  <div class="no-results" id="noResults" style="display:none;">No hay respuestas que coincidan con la búsqueda.</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Nombre</th><th>Apellidos</th><th>Categoría</th><th>Asiste</th>
          <th>Acompañante</th><th>Trat. acomp.</th><th>Nombre acomp.</th><th>Apellidos acomp.</th><th>Transporte</th>
          <th>Alergias</th><th>Alergias acomp.</th><th>Dirección</th><th>Lista ECI</th><th>IBAN</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitulo">Editar respuesta</h2>
    <form id="editForm">
      <div class="modal-grid">
        <div>
          <label for="editInvitadoPor">Invitado por</label>
          <div class="combo"><input type="text" id="editInvitadoPor" autocomplete="off" placeholder="Escribe o elige..."><ul class="combo-lista"></ul></div>
        </div>
        <div>
          <label for="editGrupo">Grupo</label>
          <div class="combo"><input type="text" id="editGrupo" autocomplete="off" placeholder="Escribe o elige..."><ul class="combo-lista"></ul></div>
        </div>
        <div>
          <label for="editTratamiento">Tratamiento</label>
          <select id="editTratamiento">
            <option value="">—</option>
            <option value="Sr.">Sr.</option>
            <option value="Sra.">Sra.</option>
            <option value="Srta.">Srta.</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="editAsiste">Asiste</label>
          <select id="editAsiste">
            <option value="completa">Toda la boda</option>
            <option value="copas">Solo copas</option>
            <option value="no">No asiste</option>
            <option value="pendiente">Pendiente de contestar</option>
          </select>
        </div>
        <div>
          <label for="editNombre">Nombre</label>
          <input type="text" id="editNombre">
        </div>
        <div>
          <label for="editApellidos">Apellidos</label>
          <input type="text" id="editApellidos">
        </div>
        <div class="span-2">
          <label for="editCalle">Calle y número</label>
          <input type="text" id="editCalle">
        </div>
        <div>
          <label for="editCp">Código postal</label>
          <input type="text" id="editCp">
        </div>
        <div>
          <label for="editCiudad">Ciudad</label>
          <input type="text" id="editCiudad">
        </div>
        <div>
          <label for="editProvincia">Provincia</label>
          <input type="text" id="editProvincia">
        </div>
        <div>
          <label for="editTransporte">Transporte</label>
          <select id="editTransporte">
            <option value="no">No necesita</option>
            <option value="ida">Ida</option>
            <option value="vuelta">Vuelta</option>
            <option value="ida_vuelta">Ida y vuelta</option>
          </select>
        </div>
        <div class="span-2">
          <label for="editAlergias">Alergias</label>
          <textarea id="editAlergias"></textarea>
        </div>
        <div>
          <label for="editConAcompanante">Acompañante</label>
          <select id="editConAcompanante">
            <option value="no">No</option>
            <option value="si">Sí</option>
          </select>
        </div>
        <div>
          <label for="editAcompananteTratamiento">Tratamiento acomp.</label>
          <select id="editAcompananteTratamiento">
            <option value="">—</option>
            <option value="Sr.">Sr.</option>
            <option value="Sra.">Sra.</option>
            <option value="Srta.">Srta.</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="editAcompananteNombre">Nombre acomp.</label>
          <input type="text" id="editAcompananteNombre">
        </div>
        <div>
          <label for="editAcompananteApellidos">Apellidos acomp.</label>
          <input type="text" id="editAcompananteApellidos">
        </div>
        <div class="span-2">
          <label for="editAcompananteAlergias">Alergias acomp.</label>
          <textarea id="editAcompananteAlergias"></textarea>
        </div>
      </div>
      <div class="modal-error" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
        <button type="submit" id="btnGuardar">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/categorias.js"></script>
<script>
  let currentData = [];
  let adminToken = '';
  let editandoId = null;
  let qrScansTotal = 0;
  let qrScansUltimo = null;

  document.getElementById('entrar').addEventListener('click', cargar);
  document.getElementById('token').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') cargar();
  });

  async function cargar() {
    const token = document.getElementById('token').value.trim();
    const errorEl = document.getElementById('gateError');
    errorEl.textContent = '';
    if (!token) return;

    try {
      const res = await fetch('/api/respuestas', {
        headers: { 'x-admin-token': token }
      });
      if (!res.ok) {
        errorEl.textContent = 'Contraseña incorrecta.';
        return;
      }
      adminToken = token;
      currentData = await res.json();
      await cargarQrScans();
      render(currentData);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    } catch (err) {
      errorEl.textContent = 'Error al conectar con el servidor.';
    }
  }

  async function recargar() {
    const res = await fetch('/api/respuestas', { headers: { 'x-admin-token': adminToken } });
    currentData = await res.json();
    await cargarQrScans();
    render(currentData);
  }

  async function cargarQrScans() {
    try {
      const res = await fetch('/api/qr-scans', { headers: { 'x-admin-token': adminToken } });
      if (!res.ok) return;
      const data = await res.json();
      qrScansTotal = data.total;
      qrScansUltimo = data.ultimo;
    } catch (err) {
      // No es crítico si falla; se mantiene el último valor conocido.
    }
  }

  document.getElementById('verQr').addEventListener('click', () => {
    window.open('/images/qr-boda.png', '_blank');
  });

  // 'propio'/'autobus'/'otro' son valores heredados de antes de tener
  // las opciones ida/vuelta/ida y vuelta/no necesito
  function transporteLabel(v) {
    if (v === 'ida') return 'Ida';
    if (v === 'vuelta') return 'Vuelta';
    if (v === 'ida_vuelta') return 'Ida y vuelta';
    if (v === 'no') return 'No necesita';
    if (v === 'propio') return 'Transporte propio (dato antiguo)';
    if (v === 'autobus') return 'Autobús (dato antiguo)';
    if (v === 'otro') return 'Otro (dato antiguo)';
    return v || '';
  }

  // 'si' es el valor heredado de antes de separar "toda la boda" / "solo copas"
  function asisteLabel(v) {
    if (v === 'completa' || v === 'si') return 'Toda la boda';
    if (v === 'copas') return 'Solo copas';
    if (v === 'pendiente') return 'Pendiente';
    return 'No asiste';
  }

  // Misma regla que lib/sobres.js: "Sra." indica casada, "Srta." no.
  function estanCasados(r) {
    return r.con_acompanante === 'si' &&
      Boolean((r.acompanante_nombre || '').trim() || (r.acompanante_apellidos || '').trim()) &&
      (r.tratamiento === 'Sra.' || r.acompanante_tratamiento === 'Sra.');
  }

  function fechaHora(v) {
    if (!v) return '—';
    return new Date(v).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function normalizar(str) {
    return String(str || '')
      .toLowerCase()
      .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  }

  function coincideBusqueda(r, termino) {
    if (!termino) return true;
    const campos = [
      r.tratamiento, r.nombre, r.apellidos,
      r.acompanante_tratamiento, r.acompanante_nombre, r.acompanante_apellidos,
      r.calle, r.cp, r.ciudad, r.provincia, r.alergias, r.acompanante_alergias,
      r.invitado_por, r.grupo
    ];
    const texto = normalizar(campos.join(' '));
    return termino.split(/\s+/).filter(Boolean).every(palabra => texto.includes(palabra));
  }

  function render(data) {
    const pendientesCount = data.filter(r => r.asiste === 'pendiente').length;
    const total = data.length - pendientesCount;
    const completaCount = data.filter(r => r.asiste === 'completa' || r.asiste === 'si').length;

    const acompanantes = data.filter(r => r.asiste !== 'no' && r.asiste !== 'pendiente' && r.con_acompanante === 'si').length;
    const totalInvitados = asistenCount + acompanantes;
    const pctAsistencia = total ? Math.round((asistenCount / total) * 100) : 0;

      <div class="stat"><div class="n">${copasCount}</div><div class="l">Solo copas</div></div>
      <div class="stat"><div class="n">${acompanantes}</div><div class="l">Acompañantes</div></div>

  function coincideAsiste(r, filtro) {
    if (!filtro) return true;
    if (filtro === 'completa') return r.asiste === 'completa' || r.asiste === 'si';
    return r.asiste === filtro;
  }

  // Filtros de selección múltiple. '' representa "Sin asignar".
  const SIN_ASIGNAR = '';
  const filtrosMulti = {
    invitadoPor: crearFiltroMulti('filtroInvitadoPor', 'Invitado por', CATEGORIAS.invitadoPor),

  function crearFiltroMulti(id, titulo, opciones) {
    const el = document.getElementById(id);
    const seleccion = new Set();
    const contenedor = el.querySelector('.filtro-opciones');
    const buscar = el.querySelector('.filtro-buscar');
    const todas = [SIN_ASIGNAR, ...opciones];

    function pintarOpciones() {
      const termino = buscar ? normalizar(buscar.value.trim()) : '';
      contenedor.innerHTML = todas
        .filter(o => !termino || normalizar(o || 'Sin asignar').includes(termino))
        .map(o => `<label><input type="checkbox" value="${escapeHtml(o)}"${seleccion.has(o) ? ' checked' : ''}>` +
          `${o ? escapeHtml(o) : '<em class="sin-asignar">Sin asignar</em>'}</label>`)
        .join('') || '<div class="search-count">Ningún grupo coincide.</div>';
    }

    function actualizarResumen() {
      el.querySelector('summary').textContent = seleccion.size ? `${titulo} (${seleccion.size})` : titulo;
      el.classList.toggle('activo', seleccion.size > 0);
    }

    contenedor.addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      if (e.target.checked) seleccion.add(e.target.value);
      else seleccion.delete(e.target.value);
      actualizarResumen();
      renderFiltrado();
    });
    if (buscar) buscar.addEventListener('input', pintarOpciones);
    el.querySelector('.filtro-limpiar').addEventListener('click', () => {
      seleccion.clear();
      if (buscar) buscar.value = '';
      pintarOpciones();
      actualizarResumen();
      renderFiltrado();
    });
    el.addEventListener('toggle', () => {
      if (el.open && buscar) buscar.focus();
    });

    pintarOpciones();
    return { seleccion, coincide: (valor) => seleccion.size === 0 || seleccion.has(valor || SIN_ASIGNAR) };
  }

  // Devuelve la opción de la lista que coincide con lo escrito (sin tener en
  // cuenta mayúsculas ni tildes), '' si está vacío o null si no existe.
  function opcionExacta(texto, opciones) {
    const t = normalizar(texto.trim());
    if (!t) return '';
    const encontrada = opciones.find(o => normalizar(o) === t);
    return encontrada === undefined ? null : encontrada;
  }

  // Desplegable en el que se puede escribir para filtrar las opciones.
  function crearCombo(input, opciones) {
    const combo = input.closest('.combo');
    const lista = combo.querySelector('.combo-lista');
    let visibles = [];
    let activo = -1;

    function pintar() {
      const t = normalizar(input.value.trim());
      // Si lo escrito ya es una opción exacta, se muestran todas para poder cambiarla.
      const exacta = opcionExacta(input.value, opciones);
      visibles = (!t || exacta) ? opciones.slice() : opciones.filter(o => normalizar(o).includes(t));
      activo = visibles.length ? Math.max(0, visibles.indexOf(exacta)) : -1;
      lista.innerHTML = visibles.length
        ? visibles.map((o, i) => `<li data-i="${i}" class="${i === activo ? 'activo' : ''}">${escapeHtml(o)}</li>`).join('')
        : '<li class="vacio">Ninguna opción coincide</li>';
      const li = lista.querySelector('li.activo');
      if (li) li.scrollIntoView({ block: 'nearest' });
    }
    function abrir() { pintar(); combo.classList.add('abierto'); }
    function cerrar() { combo.classList.remove('abierto'); }
    function elegir(i) {
      if (i < 0 || i >= visibles.length) return;
      input.value = visibles[i];
      cerrar();
    }

    input.addEventListener('focus', abrir);
    input.addEventListener('click', abrir);
    input.addEventListener('input', () => {
      combo.classList.add('abierto');
      const t = normalizar(input.value.trim());
      visibles = t ? opciones.filter(o => normalizar(o).includes(t)) : opciones.slice();
      activo = visibles.length ? 0 : -1;
      lista.innerHTML = visibles.length
        ? visibles.map((o, i) => `<li data-i="${i}" class="${i === activo ? 'activo' : ''}">${escapeHtml(o)}</li>`).join('')
        : '<li class="vacio">Ninguna opción coincide</li>';
    });
    input.addEventListener('keydown', (e) => {
      if (!combo.classList.contains('abierto')) {
        if (e.key === 'ArrowDown') { abrir(); e.preventDefault(); }
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!visibles.length) return;
        activo = (activo + (e.key === 'ArrowDown' ? 1 : -1) + visibles.length) % visibles.length;
        lista.querySelectorAll('li').forEach((li, i) => li.classList.toggle('activo', i === activo));
        lista.querySelector('li.activo').scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        elegir(activo);
      } else if (e.key === 'Escape') {
        cerrar();
      } else if (e.key === 'Tab') {
        if (input.value.trim() && activo >= 0) elegir(activo);
        cerrar();
      }
    });
    // mousedown (y no click) para elegir antes de que el input pierda el foco
    lista.addEventListener('mousedown', (e) => {
      const li = e.target.closest('li[data-i]');
      e.preventDefault();
      if (li) elegir(Number(li.dataset.i));
    });
    input.addEventListener('blur', () => {
      cerrar();
      const exacta = opcionExacta(input.value, opciones);
      if (exacta) input.value = exacta;
    });
  }

      grupo: opcionExacta(document.getElementById('editGrupo').value, CATEGORIAS.grupos)
    };

    if (payload.invitadoPor === null) {
      errorEl.textContent = '"Invitado por" tiene que ser una de las opciones de la lista.';
      return;
    }
    if (payload.grupo === null) {
      errorEl.textContent = 'El grupo tiene que ser uno de los de la lista.';
      return;
    }

    if (!payload.nombre || !payload.apellidos) {
      errorEl.textContent = 'Nombre y apellidos son obligatorios.';
      return;
    }
    if ((asiste === 'completa' || asiste === 'copas') && (!payload.tratamiento || !payload.calle || !payload.cp || !payload.ciudad || !payload.provincia)) {
      errorEl.textContent = 'Faltan campos obligatorios (tratamiento y dirección) para quien asiste.';
      return;

    const esNuevo = editandoId === null;
    try {
      const res = await fetch(esNuevo ? '/api/respuestas' : ('/api/respuestas/' + editandoId), {
        method: esNuevo ? 'POST' : 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },

    ];
    function celdaSegura(valor) {
      let str = String(valor);
      // Evita que Excel/Sheets interprete el valor como fórmula si un invitado
      // escribe algo que empieza por =, +, -, @, tab o retorno de carro.
      if (/^[=+\-@\t\r]/.test(str)) str = "'" + str;
      return `"${str.replace(/"/g, '""')}"`;
    }
    const csvRows = [columnas.map(c => c.header).join(',')];
    currentData.forEach(r => {
      csvRows.push(columnas.map(c => celdaSegura(c.valor(r))).join(','));
    });
    // El BOM (﻿) es necesario para que Excel detecte UTF-8 y no
    // rompa las tildes y la ñ al abrir el CSV.
    const blob = new Blob(['﻿' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'respuestas-rsvp.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
</script>
</body>
</html>
